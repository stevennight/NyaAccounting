name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish after successful builds
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.13.x"
  NYA_ACCOUNTING_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve dependencies
        run: npm ci

      - name: Verify version
        run: npm run version:check

      - name: Analyze and test
        run: npm run check

  android-release:
    name: Android release
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: npm ci

      - name: Verify release version
        id: version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          if [[ -n "$RELEASE_TAG_INPUT" && "$RELEASE_TAG_INPUT" != "v$version" ]]; then
            echo "Input tag $RELEASE_TAG_INPUT does not match VERSION $version"
            exit 1
          fi
          npm run version:check
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Android signing key
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          keystore_path="$RUNNER_TEMP/nya-accounting-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Generate native Android project
        run: npm exec expo -- prebuild --platform android --no-install

      - name: Configure Android build memory
        shell: bash
        run: |
          set -euo pipefail
          properties_file=android/gradle.properties

          set_property() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" "$properties_file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$properties_file"
            else
              printf '%s\n' "${key}=${value}" >> "$properties_file"
            fi
          }

          set_property org.gradle.jvmargs '-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8'
          set_property org.gradle.parallel 'false'
          set_property org.gradle.workers.max '2'
          set_property kotlin.daemon.jvmargs '-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8'

          cat "$properties_file"

      - name: Build Android artifact
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Package Android artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          apk="release-artifacts/NyaAccounting-${{ steps.version.outputs.version }}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyaAccounting-android-${{ github.run_number }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - android-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: NyaAccounting-android-${{ github.run_number }}
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NyaAccounting ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/NyaAccounting-*-android.apk
            release-artifacts/NyaAccounting-*-android.apk.sha256
